name: Build and Publish to PyPI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
        sccache: 'true'
        manylinux: auto
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-${{ matrix.target }}
        path: dist

  windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x64
            architecture: x64
            python: '3.11'
            interpreters: '3.10 3.11 3.12 3.13'
          # Native ARM Python starts at the supported modern versions; do not
          # build a wheel against the VM's emulated x64 interpreter.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
            python: '3.12'
            interpreters: '3.12'
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
            python: '3.13'
            interpreters: '3.13'
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.architecture }}
    
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist --interpreter ${{ matrix.interpreters }}
        sccache: 'true'
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-windows-${{ matrix.target }}-${{ matrix.python }}
        path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
        sccache: 'true'
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-macos-${{ matrix.target }}
        path: dist

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - run: cargo fmt --manifest-path coordination/Cargo.toml -- --check
    - run: cargo clippy --locked --manifest-path coordination/Cargo.toml --all-targets -- -D warnings
    - run: cargo test --locked --manifest-path coordination/Cargo.toml

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist
    
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: wheels-sdist
        path: dist

  test:
    needs: [linux, windows, macos, sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-11-arm
            python-version: '3.12'
          - os: windows-11-arm
            python-version: '3.13'
        exclude:
          # Reduce matrix size for faster builds
          - os: windows-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.10'
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true
    
    - name: Install wheel
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install numpy
        # Find and install the appropriate wheel for this platform
        python -m pip install --find-links dist --no-index jesse-rust
    
    - name: Check packaged coordinator
      run: python scripts/check_coordinator.py

    - name: Test import
      run: |
        python -c "import jesse_rust; print('jesse_rust imported successfully')"
    
    - name: Run basic tests
      run: |
        python -c "
        import jesse_rust
        import numpy as np
        
        # Execute existing indicator entry points so new linkage cannot hide an ABI failure.
        source = np.arange(10, dtype=np.float64)
        np.testing.assert_allclose(jesse_rust.ema(source, 3)[-1], 8.001953125)
        np.testing.assert_allclose(jesse_rust.sma_last(source, 3), 8.0)
        print('Module loaded successfully')
        print('Available functions:', [name for name in dir(jesse_rust) if not name.startswith('_')])
        "

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, native]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true
    
    - name: Publish to PyPI
      uses: PyO3/maturin-action@v1
      with:
        command: upload
        args: --non-interactive --skip-existing dist/*
      env:
        MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }} 